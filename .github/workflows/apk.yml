name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          cp -r index.html app.css app.js content.js times.js sortable.min.js fonts icons audio android-app/www/
      - name: Install and add Android
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Permissions, icons
        working-directory: android-app/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' $M
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            R=app/src/main/res/mipmap-$d
            [ -d $R ] && for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do cp ../../icons/icon-512.png $R/$f; done
          done
          rm -f app/src/main/res/mipmap-anydpi-v26/*.xml
          mkdir -p app/src/main/res/drawable
          cp ../../icons/badge.png app/src/main/res/drawable/ic_stat_doa.png
      - name: Build
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk ketab-doa.apk
      - uses: actions/upload-artifact@v4
        with: { name: ketab-doa-apk, path: ketab-doa.apk }
      - name: Computer zip
        run: |
          mkdir -p pc/ketab-doa
          sed 's#https://ediansari2727-droid.github.io/ketab-doa/audio/#audio/#g' download/ketab-doa-computer.html > "pc/ketab-doa/کتاب دعا (باز کنید).html"
          cp -r audio pc/ketab-doa/audio
          printf 'فایل «کتاب دعا (باز کنید).html» را با Chrome یا Edge باز کنید.\nپوشهٔ audio باید کنار همین فایل بماند تا صوت‌ها بدون اینترنت پخش شوند.\n' > "pc/ketab-doa/راهنما.txt"
          cd pc && zip -0 -qr ../ketab-doa-computer.zip ketab-doa
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ketab-doa.apk ketab-doa-computer.zip --title "کتاب دعای روزانه (APK)" --notes "نسخهٔ اندروید؛ ساخته‌شده از آخرین تغییرات."
